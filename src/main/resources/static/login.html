<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; display: flex; justify-content: center; padding-top: 80px; }
    .box { background: #fff; padding: 30px; border-radius: 8px; width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2d7ff9; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    #msg { margin-top: 10px; font-size: 14px; color: red; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Đăng nhập</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Mật khẩu">
    <button onclick="login()">Đăng nhập</button>
    <div id="msg"></div>
    <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
  </div>

  <script>
    async function login() {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (res.ok) {
        location.href = 'home.html';
      } else {
        document.getElementById('msg').textContent = 'Sai username hoặc password';
      }
    }
  </script>
</body>
</html>
