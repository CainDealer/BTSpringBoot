<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang chủ</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding-top: 100px; }
    button { padding: 10px 20px; background: #e53935; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1 id="hello">Đang tải...</h1>
  <button onclick="logout()">Đăng xuất</button>

  <script>
    fetch('/api/auth/me').then(async res => {
      if (res.status === 401) {
        location.href = 'login.html';
      } else {
        const data = await res.json();
        document.getElementById('hello').textContent = 'Xin chào, ' + data.username + '!';
      }
    });

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = 'login.html';
    }
  </script>
</body>
</html>
